<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI導入補助金コンシェルジュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: a top bar switches three views. Overview is one reading column.
   Staff is a sidebar + work area (today, cases, customers, help, integrations, settings).
   Client is a 400px phone column with reviewer notes beside it.
   A six-step timeline (検討→申請→交付決定→事業実施→実績報告→補助金入金) appears on every case, on both sides. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EFEF; --fg:#172024; --body:#434C53; --muted:#67727A; --line:#D5DDDE; --line-2:#E6ECEC;
  --brand-l:#0E5C63; --brand-d:#63B7BE; --brand-pale-l:#E0EEEE; --brand-pale-d:#17302F;
  --brand:var(--brand-l); --brand-pale:var(--brand-pale-l); --on-brand:#FFFFFF;
  --amber:#8A4A0C; --amber-pale:#F8ECDD;
  --ok:#1B7448; --ok-pale:#DDF1E5; --warn:#B3362B; --warn-pale:#F9E3E0; --info:#2C4A8A; --info-pale:#E5EBF8;
  --shadow:0 1px 2px rgba(16,32,36,.06),0 10px 28px rgba(16,32,36,.07);
  --num:'IBM Plex Sans','Noto Sans JP',system-ui,sans-serif; --jp:'Noto Sans JP','Yu Gothic UI','Hiragino Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1516; --surface:#162022; --sunk:#111A1C; --fg:#E9EFEF; --body:#C2CBCC; --muted:#8C9899; --line:#2B3739; --line-2:#212C2E;
  --brand:var(--brand-d); --brand-pale:var(--brand-pale-d); --on-brand:#0E1516;
  --amber:#E8AC70; --amber-pale:#3A2A16;
  --ok:#5CCB8B; --ok-pale:#153826; --warn:#F08A7E; --warn-pale:#3F1F1B; --info:#8FB0F0; --info-pale:#1B2946;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1516; --surface:#162022; --sunk:#111A1C; --fg:#E9EFEF; --body:#C2CBCC; --muted:#8C9899; --line:#2B3739; --line-2:#212C2E;
  --brand:var(--brand-d); --brand-pale:var(--brand-pale-d); --on-brand:#0E1516;
  --amber:#E8AC70; --amber-pale:#3A2A16;
  --ok:#5CCB8B; --ok-pale:#153826; --warn:#F08A7E; --warn-pale:#3F1F1B; --info:#8FB0F0; --info-pale:#1B2946;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:14px;line-height:1.65;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{line-height:1.65;resize:vertical}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:15px;height:15px}
.ic.l{width:22px;height:22px}
.muted{color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.bodyt{font-size:13.5px;color:var(--body)}

/* top bar */
.top{max-width:1180px;margin:0 auto 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;line-height:1.3}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.views{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px;max-width:100%;overflow-x:auto}
.views button{border:0;background:transparent;border-radius:7px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.views{gap:2px}.views button{padding:7px 6px;font-size:12px}}
.views button[aria-current=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tenant{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tenant select{width:auto;padding:6px 8px;font-size:12.5px}

/* buttons, chips, cards */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;line-height:1.3;text-align:center;white-space:nowrap;text-decoration:none}
.btn.p{background:var(--brand);color:var(--on-brand)}
.btn.o{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn.g{background:var(--sunk);color:var(--body)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 20px;font-size:15px}
.btn.block{width:100%;white-space:normal}
.btn:disabled{opacity:.45;cursor:default}
.lnk{border:0;background:none;padding:0;color:var(--brand);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;text-align:left;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-pale);color:var(--ok)}
.chip.warn{background:var(--warn-pale);color:var(--warn)}
.chip.amber{background:var(--amber-pale);color:var(--amber)}
.chip.info{background:var(--info-pale);color:var(--info)}
.chip.brand{background:var(--brand-pale);color:var(--brand)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.chip.solid{background:var(--brand);color:var(--on-brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.sw{position:relative;width:40px;height:23px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked=true]{background:var(--brand)}
.sw[aria-checked=true] i{left:20px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--brand-pale)}
tr.hl td{background:color-mix(in srgb,var(--brand-pale) 70%,var(--surface))}
.sec-h{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* six-step timeline */
.tlw{overflow-x:auto;padding-bottom:2px}
.tl6{display:grid;grid-template-columns:repeat(6,minmax(104px,1fr));min-width:640px}
.n6{display:flex;flex-direction:column;gap:3px;padding-right:8px;min-width:0}
.n6 .rail{display:flex;align-items:center;height:20px;margin-bottom:4px}
.n6 .rail i{width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--line);flex:none}
.n6 .rail b{flex:1;height:3px;background:var(--line);margin-left:6px;border-radius:2px}
.n6:last-child .rail b{visibility:hidden}
.n6.d .rail i{background:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.n6.d .rail b{background:var(--brand)}
.n6.c .rail i{width:18px;height:18px;background:var(--surface);box-shadow:0 0 0 4px var(--brand)}
.n6 .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.n6.c .nm{color:var(--brand)}
.n6.f .nm{color:var(--muted)}
.n6 .dd{font-size:12.5px;color:var(--body)}
.n6.f .dd{color:var(--muted)}
.n6 .dd.k{font-weight:700;color:var(--fg)}
.tls{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--body);padding-top:12px;margin-top:12px;border-top:1px solid var(--line-2)}
.tls b{color:var(--fg)}
.tls .big{font-size:15px;color:var(--brand);font-weight:700}
/* vertical timeline (phone) */
.vt li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;position:relative;padding:7px 0}
.vt li::before{content:"";position:absolute;left:8px;top:22px;bottom:-8px;width:2px;background:var(--line)}
.vt li:last-child::before{display:none}
.vt li.d::before{background:var(--brand)}
.vt .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--line);margin:4px 0 0 2px;position:relative;z-index:1}
.vt li.d .dot{background:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.vt li.c .dot{box-shadow:0 0 0 4px var(--brand)}
.vt .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vt li.c .nm{color:var(--brand)}
.vt li.f .nm{color:var(--muted)}
.vt .yd{font-size:12px;color:var(--muted)}
.vt .dt{font-size:12px;color:var(--body);text-align:right;white-space:nowrap;padding-top:2px}
.vt li.c .dt{color:var(--brand);font-weight:700}

/* overview */
.ov{display:flex;flex-direction:column;gap:44px;max-width:1040px}
.ov section{display:flex;flex-direction:column;gap:16px}
.ov h2{font-size:21px}
.ov .lead{font-size:15px;color:var(--body);max-width:44em}
.ov section.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.hero-t{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero h1{font-size:clamp(25px,3.6vw,34px);font-weight:700;letter-spacing:.01em}
.hero h1 span{display:inline-block}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.cmp{padding:6px 18px}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto minmax(0,1.1fr);gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cmp-r:last-child{border-bottom:0}
.cmp-k{font-size:12.5px;color:var(--muted);font-weight:700}
.cmp-b{font-size:13.5px;color:var(--muted);text-decoration:line-through}
.cmp-a{font-size:16px;font-weight:700;color:var(--brand)}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.val{padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.val-h{display:flex;align-items:center;gap:10px}
.val-ic{width:36px;height:36px;border-radius:10px;background:var(--brand-pale);color:var(--brand);display:grid;place-items:center;flex:none}
.val h3{font-size:17px}
.dots li{position:relative;padding-left:18px;font-size:13.5px;color:var(--body)}
.dots li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.dots{display:flex;flex-direction:column;gap:5px}
.val .lnk{margin-top:auto;padding-top:6px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.flow li{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow .who{font-size:11.5px;font-weight:700;letter-spacing:.06em}
.flow .who.c{color:var(--amber)} .flow .who.s{color:var(--brand)} .flow .who.a{color:var(--info)}
.flow b{font-size:14.5px;line-height:1.4}
.flow p{font-size:12.5px;color:var(--body)}
.flow .n{font-family:var(--num);font-size:12px;color:var(--muted);font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three .card{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.three h3{font-size:15px;display:flex;gap:8px;align-items:center}
.three h3 .ic{color:var(--brand)}
.three p{font-size:13px;color:var(--body)}
.note{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-color:var(--brand);background:var(--brand-pale)}
.note .ic{color:var(--brand);margin-top:2px}
.note h3{font-size:15px;margin-bottom:2px}
.note p{font-size:13.5px;color:var(--body)}
.note.w{border-color:var(--warn);background:var(--warn-pale)}
.note.w .ic,.note.w h3{color:var(--warn)}

/* staff */
.st{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--body);text-align:left;white-space:nowrap}
.side button[aria-current=true]{background:var(--brand-pale);color:var(--brand)}
.side .cnt{margin-left:auto;background:var(--warn);color:var(--surface);border-radius:999px;font-size:11px;padding:0 7px;font-family:var(--num)}
.side .new{margin-bottom:12px;justify-content:center;background:var(--brand);color:var(--on-brand)}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px}
.ph .sub{font-size:13px;color:var(--muted)}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;overflow:hidden}
.start div{padding:12px 16px;border-right:1px solid var(--line-2);display:flex;gap:10px;align-items:flex-start;min-width:0}
.start div:last-child{border-right:0}
.start .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.start b{display:block;font-size:13.5px}
.start span{font-size:12px;color:var(--muted)}
.todo{display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:center}
.td:last-child{border-bottom:0}
.td-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.td-ic.warn{background:var(--warn-pale);color:var(--warn)} .td-ic.info{background:var(--info-pale);color:var(--info)}
.td-ic.amber{background:var(--amber-pale);color:var(--amber)} .td-ic.ok{background:var(--ok-pale);color:var(--ok)}
.td-k{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.td-t{font-size:15px;font-weight:700;line-height:1.45}
.td-d{font-size:13px;color:var(--body)}
.td-a{display:flex;gap:8px;align-items:center}
.done-b{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.done-b:hover{border-color:var(--ok);color:var(--ok)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.sidecard h3{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.sb{display:grid;grid-template-columns:6.6em minmax(0,1fr) 1.6em;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.sb i{display:block;height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.sb .tr{background:var(--sunk);border-radius:4px}
.sb .num{text-align:right;font-weight:700}
.rd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line-2)}
.rd:first-of-type{border-top:0}
.rd .k{color:var(--muted)}
.rd b{font-size:14px}
.auto li{display:flex;gap:8px;font-size:12.5px;color:var(--body);padding:5px 0;border-bottom:1px dashed var(--line-2)}
.auto li:last-child{border-bottom:0}
.auto .ic{color:var(--ok);margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:12px 16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column}
.tile[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .n{font-size:26px;font-weight:700;line-height:1.25}
.tile.w .n{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input{max-width:260px}
.seg2{display:flex;background:var(--sunk);border-radius:8px;padding:3px;margin-left:auto}
.seg2 button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--surface);color:var(--fg)}
.board{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol h3{font-size:12.5px;padding:4px 6px;display:flex;justify-content:space-between;color:var(--body)}
.kc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.kc:hover{border-color:var(--brand)}
.kc b{font-size:13.5px;line-height:1.4}
.kc-m{font-size:12px;color:var(--muted)}
.kc-x{font-size:12px;color:var(--warn);font-weight:700;line-height:1.45}
.pipe{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.pipe i{width:14px;height:7px;border-radius:2px;background:var(--line);display:inline-block}
.pipe i.d{background:var(--brand)} .pipe i.c{background:var(--amber)}
.pipe span{font-size:12.5px;margin-left:6px}
/* case detail */
.back{align-self:flex-start}
.blocked{border-color:var(--warn);background:var(--warn-pale);color:var(--warn);padding:12px 16px;font-weight:700;font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.grp h3{font-size:12px;color:var(--muted);letter-spacing:.08em;padding:12px 18px 4px}
.grp h3.big{font-size:13px;color:var(--fg);letter-spacing:0}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px;padding:9px 18px;border-top:1px solid var(--line-2)}
.ci .w{font-size:12px;color:var(--muted);text-align:right}
.nowdo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;overflow:hidden}
.nowdo>div{padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.nowdo>div+div{border-left:1px solid var(--line-2)}
.nowdo h3{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.nx{border-color:var(--brand);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.nx h3{font-size:16px}

function manApply(o){S.view=o.v;if(o.s)S.staff=o.s;S.caseId=o.c||null;S.tab=o.t||'check';S.block=null;
 if(o.cs){cl.screen=o.cs;cl.help=null;cl.editing=null;cl.khow=null;}S.modal=o.m?JSON.parse(JSON.stringify(o.m)):null;}
/* その画面を実際に描画し、ボタンの文言を拾う（画面を変えるとここも変わる） */
function manBtns(k){const o=MAN[k].open,keep={view:S.view,staff:S.staff,caseId:S.caseId,tab:S.tab,block:S.block,modal:S.modal,cs:cl.screen,help:cl.help,ed:cl.editing,kh:cl.khow};
 try{manApply(o);const html=o.m?MOD[o.m.type](S.modal):o.v==='staff'?staffBody():CSCR[cl.screen]();const t=document.createElement('template');t.innerHTML=html;const out=[];
  t.content.querySelectorAll('.btn,.seg button,[role=tab]').forEach(b=>{const x=b.textContent.replace(/\s+/g,' ').trim();if(x&&x.length<=26&&out.indexOf(x)<0)out.push(x);});return out.slice(0,14);}
 catch(e){return [];}
 finally{Object.assign(S,{view:keep.view,staff:keep.staff,caseId:keep.caseId,tab:keep.tab,block:keep.block,modal:keep.modal});Object.assign(cl,{screen:keep.cs,help:keep.help,editing:keep.ed,khow:keep.kh});}}
function manSec(k){const e=MAN[k],steps=mf(e.steps)||[],more=mf(e.more)||[],btns=manBtns(k);
 return `<section class="card mansec" id="${mid(k)}" data-mkey="${k}"><div class="mh"><div><p class="eyebrow">${e.g==='staff'?'スタッフ':'お客様'}${e.tm?'・作業時間 '+mf(e.tm):''}</p><h3>${e.t}</h3><p class="bodyt">${mf(e.why)}</p></div><button class="btn o sm noprint" data-act="manopen" data-k="${k}">この画面を開く</button></div>
  <div class="mshot" data-shot="${k}"></div>
  <ol class="msteps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  ${more.length?`<ul class="dots">${more.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}
  ${btns.length?`<div class="mbtn"><span class="tiny">この画面のボタン</span>${btns.map(b=>`<span class="chip mute">${esc(b)}</span>`).join('')}</div>`:''}</section>`;}
const MCH=[['m-start','はじめに','today'],['m-staff','スタッフ編','cases'],['m-client','お客様編','crm'],['m-data','資料編','book']];
function manIndex(g){return `<div class="mindex">${MAN_KEYS().filter(k=>MAN[k].g===g).map(k=>`<button class="lnk" data-act="mjump" data-k="${k}">${MAN[k].t}</button>`).join('')}</div>`;}
function manualV(){const gaps=MAN_GAPS(),ver=MAN_VER(),nr=NEXTR();
 const tbl=(h,rows,w)=>`<div class="card tscroll"><table style="min-width:${w||560}px"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const ctime=[['書類のアップ（手元にあれば）',fmtMin(TIME.docs)],['質問への回答',fmtMin(TIME.qs)],['gBizIDプライムの申請',fmtMin(TIME.gbiz)],['連絡用メールと転送設定',fmtMin(TIME.mail)]].concat(MUST.map(k=>['加点：'+k.name,k.time]),[['内容の確認と送信',fmtMin(TIME.confirm)],['<b>合計の目安</b>','<b>'+fmtMin(TSUM())+'</b>']]);
 return `<div class="wrap st man"><aside class="side noprint" aria-label="マニュアルの目次">${MCH.map(c=>`<button data-act="mjump" data-id="${c[0]}">${ic(c[2])}${c[1]}</button>`).join('')}</aside>
 <div class="main" data-manual="1" data-ver="${ver}" data-keys="${MAN_KEYS().join(' ')}" data-gaps="${esc(gaps.join(' '))}"><!--MANUAL-START-->
 <div class="ph"><div><h1>操作マニュアル</h1><p class="sub">このマニュアルは、アプリ本体の画面とデータから毎回自動で作られます。画面・日程・加点・質問を変えると、ここも同時に変わります。</p></div><div class="r noprint"><button class="btn o sm" data-act="print">${ic('doc','s')}印刷・PDFで保存</button></div></div>
 <p class="tiny">版 ${ver}・${MAN_KEYS().length}画面・表示ブランド：${esc(S.t.name)}</p>
 ${gaps.length?`<div class="card note w">${ic('alert','l')}<div><h3>説明がまだない画面があります</h3><p>${esc(gaps.join('、'))}</p></div></div>`:''}
 <h2 class="sec-h" id="m-start">はじめに</h2>
 <div class="card pad"><p class="bodyt">AI導入補助金コンシェルジュは、申請に必要な書類と情報を、専用リンク1本で集めて進行を管理するツールです。スタッフは「スタッフ画面」、お客様はスマホで「お客様の画面」を使います。</p>
  <ol class="msteps" style="margin-top:10px"><li>スタッフが名刺から案件を作り、専用リンクをLINEで送ります。</li><li>お客様がリンクを開き、書類のアップ・質問・お手続き・加点を進めます（全部で${fmtMin(TSUM())}が目安）。</li><li>スタッフは「今日やること」に出る項目を上から片づけ、申請まで進めます。</li></ol></div>
 ${tbl(['ステップ','ひとことで','自社がやること','お客様がやること'],PH.map((p,i)=>[`<b>${i+1}. ${p}</b>`,PH_SHORT[i],PH_DO[i].s.join('<br>'),PH_DO[i].c.join('<br>')]),760)}
 <p class="tiny">次の締切：${nr.n} ${fdw(nr.close)}（${leftTxt(nr.close)}）。日程は「資料編」を見てください。</p>
 <h2 class="sec-h" id="m-staff">スタッフ編</h2>${manIndex('staff')}
 ${MAN_KEYS().filter(k=>MAN[k].g==='staff').map(manSec).join('')}
 <h2 class="sec-h" id="m-client">お客様編</h2>${manIndex('client')}
 ${MAN_KEYS().filter(k=>MAN[k].g==='client').map(manSec).join('')}
 <h2 class="sec-h" id="m-data">資料編</h2>
 <h3 class="mh3">お客様の作業時間の目安</h3>${tbl(['作業','目安'],ctime,420)}
 <h3 class="mh3">公募回の日程</h3>${tbl(['公募回','締切','交付決定','実績報告の期限','入金の目安','確認'],ROUNDS.map(r=>[`<b>${r.n}</b>`,fdw(r.close),fd(r.decide),fd(r.end),r.pay,SRCCHIP[r.src]]),700)}
 <h3 class="mh3">加点項目と所要時間</h3>${tbl(['項目','所要時間','担当','条件'],KATEN.map(k=>[(k.must?'<span class="chip solid">ほぼ必須</span> ':'')+k.name,k.time,esc(k.who),k.cond]),760)}
 <h3 class="mh3">自動で動くルール</h3>${tbl(['きっかけ','システムがすること','状態'],RULES.map((r,i)=>[r[0],r[1],S.rules[i]?'<span class="chip ok">オン</span>':'<span class="chip mute">オフ</span>']),620)}
 <h3 class="mh3">連携先</h3>${tbl(['連携先','できること','状態'],LINKS.map(l=>[l.n,l.d,S.links[l.id]?'<span class="chip ok">接続中</span>':'<span class="chip mute">未接続</span>']),620)}
 <h3 class="mh3">お客様に聞く質問</h3>${tbl(['質問','表示'],S.questions.map(q=>[esc(q.label),q.on?'<span class="chip ok">表示</span>':'<span class="chip mute">非表示</span>']),420)}
 <p class="tiny">所要時間・入金の目安は当社の見込みです。日程と加点の条件は、公式サイトで確認してください。</p>
 <!--MANUAL-END--></div></div>`;}
/* お客様のスマホ画面の中の「このページの使い方」 */
function cManual(){const ks=MAN_KEYS().filter(k=>MAN[k].g==='client'&&k!=='c:manual'&&k!=='c:done');
 return pBar('このページの使い方')+`<div class="p-body"><p class="p-lead">画面ごとの使い方です。知りたいところを押してください。</p>
 <div class="pre faq">${ks.map(k=>{const e=MAN[k];return `<details><summary>${e.t}${e.tm?`<span class="tiny"> ${mf(e.tm)}</span>`:''}</summary><p>${mf(e.why)}</p><ol class="msteps">${(mf(e.steps)||[]).map(s=>`<li>${s}</li>`).join('')}</ol>${k!=='c:home'?`<p><button class="lnk" data-act="cnav" data-s="${e.open.cs}">この画面へ</button></p>`:''}</details>`;}).join('')}</div>
 <button class="btn p lg block" data-act="cnav" data-s="home">もどる</button></div>`;}

function renderModal(){const m=$('#modal');if(!S.modal){m.hidden=true;m.innerHTML='';return;}
 m.hidden=false;m.innerHTML=`<div class="modal-bg" data-act="close"></div><div class="modal-box" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="閉じる">${ic('x','s')}</button>${MOD[S.modal.type](S.modal)}</div>`;}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true;},2200);}
function copy(text,after){const ok=()=>toast(after||'コピーしました');
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,()=>toast('コピーできませんでした。文面を選択してコピーしてください'));}else toast('文面を選択してコピーしてください');}

/* ================= ACTIONS ================= */
function setHash(){try{history.replaceState(null,'','#'+S.view);}catch(e){}}
function getHolder(p){const ks=p.split('.'),last=ks.pop();return[ks.reduce((o,k)=>o[k],S),last];}
const A={
 view(d){S.view=d.v;setHash();render();window.scrollTo(0,0);},
 go(d){S.view=d.v;if(d.s){S.staff=d.s;S.caseId=null;}setHash();render();window.scrollTo(0,0);},
 snav(d){S.staff=d.s;S.caseId=null;S.block=null;render();window.scrollTo(0,0);},
 open(d){S.view='staff';S.staff='cases';S.caseId=d.id;S.tab=d.tab||'check';S.block=null;setHash();render();window.scrollTo(0,0);},
 closecase(){S.caseId=null;S.block=null;render();},
 tab(d){S.tab=d.t;render();},
 filter(d){S.filter=d.f;render();},
 mode(d){S.mode=d.m;render();},
 todo(d){const a=TODAY().find(x=>x.id===d.a);if(a.act==='nudge'){S.modal={type:'nudge',id:a.cid};renderModal();}else A.open({id:a.cid,tab:a.tab});},
 tdone(d){S.done[d.a]=true;toast('済みにしました');render();},
 advance(d){const c=byId(d.id);if(c.phase<=1&&c.miss.length){S.block=c.id;S.view='staff';S.staff='cases';S.caseId=c.id;S.tab='check';render();return;}
  if(c.phase<6){if(c===MIDORI)c.manual=c.phase+1;else c.phase++;}
  const np=c===MIDORI?c.manual:c.phase;S.block=null;render();toast(`「${BCOL[np]}」に進めました。PMSにタスクを作成しました`);},
 fixc(d){const c=byId(d.id);c.fixed=true;c.miss=[];S.done.a3=true;S.block=null;render();toast('確定しました。申請データに反映しました');},
 nudge(d){S.modal={type:'nudge',id:d.id};renderModal();},
 offer(d){S.modal={type:'offer',o:d.o};renderModal();},
 guide(d){if(d.id==='c1')cl.guide=true;toast('入力ガイドのリンクを用意しました。LINEで送れます');},
 newcase(){S.modal={type:'newcase',step:0,n:NEWCO[(seq-10)%NEWCO.length]};renderModal();},
 wiz(d){const step=+d.step;if(step===1){S.modal.step=1;renderModal();setTimeout(()=>{if(S.modal&&S.modal.type==='newcase'){S.modal.step=2;renderModal();}},1300);return;}
  if(step===3){const n=S.modal.n,sel=$('#roundSel'),rid=sel?sel.value:NEXTR().id;const c=mk(n.co,n.ind,n.rep,n.addr,n.emp,1,'client',rid,Object.assign({},NOTHING,{kat:Object.assign({},KNONE),miss:['書類3点','質問4つ','お手続き2つ','加点3項目'],upd:'たった今'}));CASES.push(c);S.modal={type:'newcase',step:3,cid:c.id,n:n,rid:rid};render();}},
 close(){S.modal=null;renderModal();},
 copy(d){copy(d.text);},
 copyta(){const t=$('#mTxt');if(t){t.select();copy(t.value);}},
 msg(d){toast(d.m);},
 tog(d){const h=getHolder(d.k);h[0][h[1]]=!h[0][h[1]];render();},
 brand(d){S.t.brand=+d.i;render();},
 km(d){S.katenMode=d.v;render();},
 addq(){const i=$('#newQ'),v=(i.value||'').trim();if(!v){toast('質問文を入力してください');i.focus();return;}S.questions.push({id:'qx'+Date.now(),label:v,type:'text',ph:'',on:true,custom:true});render();toast('質問を追加しました。お客様の画面に出ます');},
 cnav(d){cl.screen=d.s;cl.help=null;cl.editing=null;cl.khow=null;render();window.scrollTo(0,0);},
 upload(d){const i=+d.i;cl.docs[i]='reading';cl.help=null;render();setTimeout(()=>{if(cl.docs[i]==='reading'){cl.docs[i]='got';render();}},1200);},
 later(d){cl.docs[+d.i]='later';cl.help=null;render();},
 redo(d){cl.docs[+d.i]='none';render();},
 how(d){cl.help=cl.help===+d.i?null:+d.i;render();},
 seg(d){cl.ans[d.k]=d.v;render();},
 kseg(d){cl.kat[d.k]=d.v;render();if(d.v==='一緒にやりたい')toast('担当者に通知しました');},
 khow(d){cl.khow=cl.khow===d.k?null:d.k;render();},
 fwdtest(){if(!cl.ans.mail){cl.fwd='need';render();return;}cl.fwd='checking';render();setTimeout(()=>{if(cl.fwd==='checking'){cl.fwd='ok';render();}},1300);},
 fix(d){cl.editing=+d.i;render();const e=$('#fix'+d.i);if(e)e.focus();},
 fixok(){cl.editing=null;render();},
 send(){cl.sent=true;cl.screen='done';render();window.scrollTo(0,0);},
 man(d){S.view='manual';S.modal=null;setHash();render();manScroll(d.k?mid(d.k):null);},
 mjump(d){manScroll(d.id||mid(d.k));},
 manopen(d){manApply(MAN[d.k].open);setHash();render();window.scrollTo(0,0);},
 print(){window.print();},
 creset(){Object.assign(cl,{screen:'home',docs:['none','none','none'],ans:{},kat:{},fwd:'no',sent:false,fixes:{},editing:null,help:null,guide:false,agree:false,khow:null});MIDORI.manual=0;render();toast('最初の状態にもどしました');}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f)f(t.dataset,t);});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='caseQ'){S.q=t.value.trim();$('#caseList').innerHTML=caseList();return;}
 if(!t.dataset||!t.dataset.bind)return;const h=getHolder(t.dataset.bind);h[0][h[1]]=t.type==='checkbox'?t.checked:t.value;
 if(t.dataset.bind.indexOf('t.')===0){const p=$('#brandPrev');if(p)p.innerHTML=brandPrev();return;}
 if(t.dataset.bind==='client.ans.mail'&&cl.fwd!=='no'){cl.fwd='no';}
 const qe=t.closest('.q[data-q]');if(qe){const q=S.questions.find(x=>x.id===qe.dataset.q);if(q)qe.classList.toggle('okq',qDone(q));}
 if(t.dataset.re||t.tagName==='SELECT')render();});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.file!=null){A.upload({i:t.dataset.file});return;}
 if(t.dataset&&t.dataset.card){A.wiz({step:1});return;}
 if(t.id==='tenantSel'){S.t=Object.assign({},TENANTS[t.value]);render();toast(t.value==='other'?'他社で使った場合の見え方に切り替えました':'スマートコンテンツの表示にもどしました');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)A.close();});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['overview','staff','client','manual'].indexOf(v)>-1&&v!==S.view){S.view=v;render();}});

function manScroll(id){const e=id&&document.getElementById(id);if(e)e.scrollIntoView({block:'start'});else window.scrollTo(0,0);}
function render(){syncMidori();applyBrand();
 document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===S.view)));
 $('#logoMark').innerHTML=ic('star');
 $('#app').innerHTML=S.view==='overview'?overview():S.view==='staff'?staff():S.view==='manual'?manualV():client();
 renderModal();}
const h0=decodeURIComponent(location.hash.slice(1));if(['overview','staff','client','manual'].indexOf(h0)>-1)S.view=h0;
/* #open/画面名 で、その画面を直接開く（マニュアルのリンクと画面写真の自動撮影に使う） */
if(h0.indexOf('open/')===0&&MAN[h0.slice(5)])manApply(MAN[h0.slice(5)].open);
render();
})();
</script>

</html>
